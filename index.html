<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fantasy 11</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="AI Photo Enhancer & Tools">
    
    <!-- PWA Setup -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>
    <div id="error-log" style="color:red; background: white; padding: 20px; font-family: monospace; white-space: pre-wrap; display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2147483647; overflow-y: auto; font-size: 20px; font-weight: bold;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1) return;
        var el = document.getElementById('error-log');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Global Error: ' + msg + '\n' + (error && error.stack ? error.stack : '') + '\n\n';
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? (event.reason.stack || event.reason) : event.reason;
        if (reason && (reason.toString().indexOf('[vite]') !== -1 || reason.toString().indexOf('WebSocket') !== -1)) return;
        var el = document.getElementById('error-log');
        if (el) {
          el.style.display = 'block';
          el.innerText += 'Unhandled Promise Rejection: ' + reason + '\n\n';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('ServiceWorker registration successful');
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
